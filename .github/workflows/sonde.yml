# Sonde de disponibilité : interroge https://joy-boy.fr/api/status toutes les 30 minutes.
# Si le site ne répond pas, l'exécution échoue et GitHub envoie un e-mail au propriétaire du dépôt
# (réglage par défaut des notifications « Actions »). Aucune donnée n'est envoyée au site.
name: Sonde du site

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: joy-boy.fr répond
        run: |
          for essai in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://joy-boy.fr/api/status) || code=000
            echo "essai $essai : HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 60
          done
          echo "::error::joy-boy.fr ne répond pas (dernier code HTTP : $code)"
          exit 1
