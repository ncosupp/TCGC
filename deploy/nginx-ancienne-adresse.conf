# Redirection de l'ancienne adresse www.stock-analyzer.fr/tcgc/... vers https://joy-boy.fr/... (depuis le 12 nov. 2026).
# En production : contenu de /etc/nginx/snippets/tcgc.conf, inclus par `include snippets/tcgc.conf;` dans le bloc
# `server` HTTPS du site stockanalyser (qui partage le serveur : ne pas le casser).
# Après modification : sudo nginx -t && sudo systemctl reload nginx

location = /tcgc { return 301 https://joy-boy.fr/; }
location ^~ /tcgc/ { rewrite ^/tcgc/(.*)$ https://joy-boy.fr/$1 permanent; }
