# Site nginx de TCGC, servi à la racine de son propre domaine (en production : joy-boy.fr).
# Copie : sudo cp /opt/tcgc/app/deploy/nginx-tcgc.conf /etc/nginx/sites-available/joyboy
#         sudo ln -s /etc/nginx/sites-available/joyboy /etc/nginx/sites-enabled/joyboy
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d joy-boy.fr -d www.joy-boy.fr   (ajoute le HTTPS et la redirection depuis le HTTP)
# Avec un autre domaine, remplacer server_name. Le service doit avoir PUBLIC_PATH vide (deploy/tcgc.service).
#
# Pour servir l'appli dans un sous-dossier d'un site existant (https://exemple.fr/tcgc/), voir plutôt
# nginx-sous-dossier.conf. L'ancienne adresse www.stock-analyzer.fr/tcgc/ redirige vers joy-boy.fr :
# voir nginx-ancienne-adresse.conf.

#
# Site déjà en place (certbot a ajouté son bloc « listen 443 » au fichier installé) : NE PAS recopier ce fichier par-dessus,
# il effacerait le HTTPS. Ajouter à la main dans /etc/nginx/sites-available/joyboy les lignes marquées « audit » (la
# map et la zone en tête du fichier, add_header et le bloc location /api/auth/ dans le server qui a « listen 443 »),
# puis : sudo nginx -t && sudo systemctl reload nginx

# Audit : connexion, inscription, essai sans compte, mot de passe oublié (POST sur /api/auth/) : 10 par minute et par
# adresse (rafale de 10), en plus des limites du serveur (audit du 14 nov. 2026, P1-7). Les GET (/api/auth/me à chaque
# ouverture de l'appli) ne sont pas limités (clé vide). Zone propre à TCGC : nginx est partagé avec un autre site.
map $request_method $tcgc_auth_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $tcgc_auth_key zone=tcgc_auth:10m rate=10r/m;

server {
    listen 80;
    server_name joy-boy.fr www.joy-boy.fr;

    # Audit : HTTPS seulement pendant un an (P1-9). Ignoré par les navigateurs tant que la page arrive en HTTP : il prend effet
    # sur le bloc « listen 443 » que certbot ajoute à ce server. Le serveur l'envoie aussi lui-même en HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Audit : limite des POST de /api/auth/ (voir la zone tcgc_auth plus haut)
    location /api/auth/ {
        limit_req zone=tcgc_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # photos envoyées par le scanner (8 Mo au plus côté serveur)
        client_max_body_size 9m;
        proxy_read_timeout 120s;
    }
}
