# Site nginx de TCGC, servi à la racine de son propre domaine (en production : joy-boy.fr).
# Copie : sudo cp /opt/tcgc/app/deploy/nginx-tcgc.conf /etc/nginx/sites-available/joyboy
#         sudo ln -s /etc/nginx/sites-available/joyboy /etc/nginx/sites-enabled/joyboy
#         sudo nginx -t && sudo systemctl reload nginx
#         sudo certbot --nginx -d joy-boy.fr -d www.joy-boy.fr   (ajoute le HTTPS et la redirection depuis le HTTP)
# Avec un autre domaine, remplacer server_name. Le service doit avoir PUBLIC_PATH vide (deploy/tcgc.service).
#
# Pour servir l'appli dans un sous-dossier d'un site existant (https://exemple.fr/tcgc/), voir plutôt
# nginx-sous-dossier.conf. L'ancienne adresse www.stock-analyzer.fr/tcgc/ redirige vers joy-boy.fr :
# voir nginx-ancienne-adresse.conf.

server {
    listen 80;
    server_name joy-boy.fr www.joy-boy.fr;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # photos envoyées par le scanner
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }
}
